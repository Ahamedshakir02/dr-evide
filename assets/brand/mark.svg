<!--
  Dr Evide — the mark.

  A map pin whose counter is a medical cross, which is the product name drawn
  rather than written: "ഡോക്ടർ എവിടെ?" is "where is the doctor?", so the shape
  answers "where" and the hole in it answers "which kind".

  One closed path with fill-rule="evenodd", so the cross is negative space
  rather than a second shape stacked on top. That matters more than it looks:
  it means the mark is a single silhouette, so it can be filled with one colour,
  used as a mask, or handed to Android as a monochrome adaptive icon without
  redrawing it.

  Geometry is exact rather than eyeballed, because the tangents have to meet the
  circle cleanly at any size. Circle: centre (24,19), r 13. Apex: (24,43). The
  tangent points at (13.06,26.03) and (34.94,26.03) are where a line from the
  apex touches that circle - so the taper is continuous with the curve instead
  of kinking into it.

  No <text> anywhere: at 16px a favicon has no room for a letterform, and text
  in an SVG rasterises against whatever font the renderer happens to have.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Dr Evide">
  <path
    fill="#0f766e"
    fill-rule="evenodd"
    d="M13.06 26.03 A13 13 0 1 1 34.94 26.03 L24 43 Z
       M21.5 11.5 H26.5 V16.5 H31.5 V21.5 H26.5 V26.5 H21.5 V21.5 H16.5 V16.5 H21.5 Z"
  />
</svg>
