name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Runs first, and on its own, because it is the one check that protects a
      # product promise rather than a behaviour: no one can pay to rank higher.
      - name: Ranking integrity
        run: npm run check:integrity

      - name: Typecheck
        run: npm run typecheck

      # The suite includes the emergency red-flag corpus. A failure there is a
      # release blocker, not a test to update.
      - name: Test
        run: npm test

      - name: Build web
        run: npm run build
